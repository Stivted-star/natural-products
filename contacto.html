<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto | Natural Products</title>

    <link rel="stylesheet" href="css/estilos.css">

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <img src="img/productos.png" alt="Logo Natural Products">
            <h1>Natural Products</h1>

        </div>

        <nav class="menu">

            <a href="index.html">Inicio</a>

            <a href="productos.html">Productos</a>

            <a href="contacto.html">Contacto</a>

        </nav>

    </header>

    <!-- BANNER -->

    <section class="banner-contacto">

        <h2>Contáctanos</h2>

        <p>
            Estamos disponibles para ayudarte y responder
            cualquier duda sobre nuestros productos.
        </p>

    </section>

    <!-- CONTACTO -->

    <section class="contacto">

        <!-- FORMULARIO -->

        <div class="formulario-contacto">

            <h3>Envíanos un mensaje</h3>

            <form>

                <input type="text" placeholder="Nombre completo">

                <input type="email" placeholder="Correo electrónico">

                <textarea placeholder="Escribe tu mensaje"></textarea>

                <button type="submit">
                    Enviar Mensaje
                </button>

            </form>

        </div>

        <!-- INFORMACIÓN -->

        <div class="info-contacto">

            <h3>Información de contacto</h3>

            <p>📧 naturalproducts@gmail.com</p>

            <p>📞 +57 321 254 3581</p>

            <p>📍 Bogotá, Colombia</p>

            <p>🕒 Lunes a Sábado 8:00am - 6:00pm</p>

        </div>

    </section>

</body>

</html>
